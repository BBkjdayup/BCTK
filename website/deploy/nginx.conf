# Independent official website. Existing API and updater virtual hosts are unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name tktiku.cn www.tktiku.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://tktiku.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tktiku.cn;
    ssl_certificate /etc/letsencrypt/live/tktiku.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tktiku.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://tktiku.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tktiku.cn;
    ssl_certificate /etc/letsencrypt/live/tktiku.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tktiku.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/tktiku-site/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    access_log /var/log/nginx/tktiku-site.access.log;
    error_log /var/log/nginx/tktiku-site.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml;

    # Same-origin read-only metadata keeps the public download link current.
    location = /updates/latest.json {
        alias /var/www/tktiku-updates/latest.json;
        default_type application/json;
        expires -1;
        limit_except GET { deny all; }
    }

    location ^~ /updates/ { return 404; }
    location ~ /\. { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        limit_except GET { deny all; }
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
        limit_except GET { deny all; }
    }
}
