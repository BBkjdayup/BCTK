# Temporary HTTP entry for the first certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name tktiku.cn www.tktiku.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 302 https://api.tktiku.cn/;
    }
}
